name: BabyKickCount
options:
  bundleIdPrefix: com.babykickcount
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Deliberately left in Swift 5 language mode. Swift 6 mode turns every
    # actor-isolation inference into a hard error, which is a separate piece of
    # work from raising the deployment target and should not ride along with a
    # design change.
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BabyKickCount:
    type: application
    platform: iOS
    sources:
      - path: BabyKickCount
        excludes:
          - Info.plist
          # Generated below; must not also be copied into the bundle.
          - BabyKickCount.entitlements
      # Compiled into both the app and the widget extension.
      - path: Shared
    info:
      path: BabyKickCount/Info.plist
      properties:
        CFBundleDisplayName: Littletaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    entitlements:
      path: BabyKickCount/BabyKickCount.entitlements
      properties:
        # Lets the "your window is up" alert break through a Focus. Needs no
        # Apple approval, but it does change the App ID's capability set, so
        # the first archive after adding it needs the provisioning profile
        # regenerating (or -allowProvisioningUpdates).
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      # Embeds the widget extension that renders the Live Activity.
      - target: LittletapsWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app
        DEVELOPMENT_TEAM: 72D6H97SLU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # Renders the session Live Activity and nothing else. Deliberately no Home or
  # Lock Screen widgets: those read from a timeline provider running in this
  # process, which would require moving the SwiftData store into an App Group
  # and migrating every existing user's data. A Live Activity is handed its
  # state by value, so it needs none of that.
  LittletapsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LittletapsWidgets
        excludes:
          - Info.plist
      - path: Shared
      # Shared so the Live Activity is drawn from the same palette as the app.
      # A local package would be the answer if a second extension ever appears;
      # for one file it would be pure ceremony.
      - path: BabyKickCount/DesignSystem/Theme.swift
    info:
      path: LittletapsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Littletaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.widgets
        DEVELOPMENT_TEAM: 72D6H97SLU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  BabyKickCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabyKickCountTests
    dependencies:
      - target: BabyKickCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.tests
        GENERATE_INFOPLIST_FILE: YES

  BabyKickCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabyKickCountUITests
    dependencies:
      - target: BabyKickCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BabyKickCount

schemes:
  BabyKickCount:
    build:
      targets:
        BabyKickCount: all
        LittletapsWidgets: all
        BabyKickCountTests: [test]
        BabyKickCountUITests: [test]
    test:
      targets:
        - BabyKickCountTests
        - BabyKickCountUITests
    run:
      config: Debug
    archive:
      config: Release
