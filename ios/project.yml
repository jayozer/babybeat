name: BabyKickCount
options:
  bundleIdPrefix: com.babykickcount
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BabyKickCount:
    type: application
    platform: iOS
    sources:
      - path: BabyKickCount
        excludes:
          - Info.plist
          # Generated below; must not also be copied into the bundle.
          - BabyKickCount.entitlements
    info:
      path: BabyKickCount/Info.plist
      properties:
        CFBundleDisplayName: Littletaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: BabyKickCount/BabyKickCount.entitlements
      properties:
        # Lets the "your window is up" alert break through a Focus. Needs no
        # Apple approval, but it does change the App ID's capability set, so
        # the first archive after adding it needs the provisioning profile
        # regenerating (or -allowProvisioningUpdates).
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app
        DEVELOPMENT_TEAM: 72D6H97SLU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  BabyKickCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabyKickCountTests
    dependencies:
      - target: BabyKickCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.tests
        GENERATE_INFOPLIST_FILE: YES

  BabyKickCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabyKickCountUITests
    dependencies:
      - target: BabyKickCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BabyKickCount

schemes:
  BabyKickCount:
    build:
      targets:
        BabyKickCount: all
        BabyKickCountTests: [test]
        BabyKickCountUITests: [test]
    test:
      targets:
        - BabyKickCountTests
        - BabyKickCountUITests
    run:
      config: Debug
    archive:
      config: Release
