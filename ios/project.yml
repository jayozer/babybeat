name: BabyKickCount
options:
  bundleIdPrefix: com.babykickcount
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BabyKickCount:
    type: application
    platform: iOS
    sources:
      - path: BabyKickCount
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      # Embeds the watch app into the iPhone app (Embed Watch Content).
      - target: BabyKickCountWatch
    info:
      path: BabyKickCount/Info.plist
      properties:
        CFBundleDisplayName: Littletaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app
        DEVELOPMENT_TEAM: 72D6H97SLU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # Modern single-target watchOS app. Shares the models, state machine,
  # stores, view model, theme, and disclaimer with the iPhone target by
  # source membership — deliberately no shared framework for ~a dozen files.
  BabyKickCountWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BabyKickCountWatch
        excludes:
          - Info.plist
      - path: Shared
      - path: BabyKickCount/Models
      - path: BabyKickCount/Services/SessionStateMachine.swift
      - path: BabyKickCount/Services/SessionStore.swift
      - path: BabyKickCount/Services/PreferencesStore.swift
      - path: BabyKickCount/ViewModels/SessionViewModel.swift
      - path: BabyKickCount/DesignSystem/Theme.swift
      - path: BabyKickCount/App/MedicalDisclaimer.swift
    info:
      path: BabyKickCountWatch/Info.plist
      properties:
        CFBundleDisplayName: Littletaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.babykickcount.app
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.watchkitapp
        DEVELOPMENT_TEAM: 72D6H97SLU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  BabyKickCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabyKickCountTests
    dependencies:
      - target: BabyKickCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.tests
        GENERATE_INFOPLIST_FILE: YES

  BabyKickCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabyKickCountUITests
    dependencies:
      - target: BabyKickCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babykickcount.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BabyKickCount

schemes:
  BabyKickCount:
    build:
      targets:
        BabyKickCount: all
        BabyKickCountTests: [test]
        BabyKickCountUITests: [test]
    test:
      targets:
        - BabyKickCountTests
        - BabyKickCountUITests
    run:
      config: Debug
    archive:
      config: Release

  BabyKickCountWatch:
    build:
      targets:
        BabyKickCountWatch: all
    run:
      config: Debug
    archive:
      config: Release
